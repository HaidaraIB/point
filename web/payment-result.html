<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Point OS — Payment</title>
  <link rel="stylesheet" href="payment-pages.css">
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-group" role="group" aria-label="Language">
        <button type="button" class="toolbar-btn" id="lang-ar" data-lang="ar">العربية</button>
        <button type="button" class="toolbar-btn" id="lang-en" data-lang="en">English</button>
      </div>
      <div class="toolbar-group" role="group" aria-label="Theme">
        <button type="button" class="toolbar-btn icon-btn" id="theme-light" aria-label="Light mode">☀</button>
        <button type="button" class="toolbar-btn icon-btn" id="theme-dark" aria-label="Dark mode">☾</button>
      </div>
    </div>
    <div class="brand" id="brand">Point OS</div>
    <div class="card card--center">
      <div id="view-verifying">
        <div class="spinner" aria-hidden="true"></div>
        <h1 class="verifying" id="title-verifying"></h1>
        <p class="message" id="msg-verifying"></p>
      </div>
      <div id="view-paid" hidden>
        <div class="icon success" aria-hidden="true">✓</div>
        <h1 class="success" id="title-paid"></h1>
        <p class="message" id="msg-paid"></p>
      </div>
      <div id="view-failed" hidden>
        <div class="icon failed" aria-hidden="true">✕</div>
        <h1 class="failed" id="title-failed"></h1>
        <p class="message" id="msg-failed"></p>
      </div>
      <div id="view-pending" hidden>
        <div class="icon pending" aria-hidden="true">…</div>
        <h1 class="pending" id="title-pending"></h1>
        <p class="message" id="msg-pending"></p>
      </div>
      <div class="refs" id="refs" hidden></div>
      <p class="hint" id="hint"></p>
      <p class="hint" id="back-pay" hidden><a id="back-pay-link" href="#"></a></p>
    </div>
  </div>
  <script src="payment-pages-shared.js"></script>
  <script>
    (function () {
      var shared = window.PointPaymentPages;
      var STATUS_ENDPOINT = shared.statusEndpoint;
      var POLL_MS = 3000;
      var POLL_MAX = 20;
      var params = new URLSearchParams(location.search);
      var zaincashReturn = null;
      var currentView = "verifying";
      var pendingFinal = false;
      var failedIsError = false;

      var STRINGS = {
        ar: {
          brand: "Point OS",
          verifyingTitle: "جاري التحقق من الدفع",
          verifyingMsg: "يرجى الانتظار بينما نؤكد حالة الدفع مع مزود الخدمة.",
          paidTitle: "تم استلام الدفع",
          paidMsg: "شكراً لك. تم تسجيل دفعتك بنجاح.",
          failedTitle: "لم يكتمل الدفع",
          failedMsg: "لم تتم عملية الدفع. يمكنك المحاولة مرة أخرى عبر رابط الفاتورة.",
          pendingTitle: "الدفع قيد المعالجة",
          pendingMsg: "ما زلنا نؤكد حالة الدفع. سنحدّث هذه الصفحة تلقائياً.",
          pendingFinalTitle: "الدفع قيد التأكيد",
          pendingFinalMsg: "سيتم تأكيد الدفع قريباً. يمكنك إغلاق هذه الصفحة بأمان.",
          orderRef: "مرجع الطلب",
          paymentRef: "مرجع الدفع",
          closeHint: "يمكنك إغلاق هذه النافذة الآن.",
          backToPay: "اختيار طريقة دفع أخرى",
          errorTitle: "تعذّر التحقق",
          errorMsg: "حدث خطأ أثناء التحقق من الدفع. يرجى المحاولة لاحقاً.",
        },
        en: {
          brand: "Point OS",
          verifyingTitle: "Verifying payment",
          verifyingMsg: "Please wait while we confirm your payment with the provider.",
          paidTitle: "Payment received",
          paidMsg: "Thank you. Your payment was recorded successfully.",
          failedTitle: "Payment not completed",
          failedMsg: "The payment was not completed. You can try again using the invoice link.",
          pendingTitle: "Payment processing",
          pendingMsg: "We are still confirming your payment. This page will update automatically.",
          pendingFinalTitle: "Payment pending confirmation",
          pendingFinalMsg: "Your payment will be confirmed shortly. You can safely close this page.",
          orderRef: "Order reference",
          paymentRef: "Payment reference",
          closeHint: "You can close this window now.",
          backToPay: "Choose another payment method",
          errorTitle: "Verification failed",
          errorMsg: "We could not verify the payment. Please try again later.",
        },
      };

      var chrome = shared.initToolbar({
        onLangChange: function () { renderAllText(); },
        onThemeChange: function () {},
      });

      function t() {
        return STRINGS[chrome.getLang()];
      }

      function renderAllText() {
        var copy = t();
        document.getElementById("brand").textContent = copy.brand;
        document.getElementById("title-verifying").textContent = copy.verifyingTitle;
        document.getElementById("msg-verifying").textContent = copy.verifyingMsg;
        document.getElementById("title-paid").textContent = copy.paidTitle;
        document.getElementById("msg-paid").textContent = copy.paidMsg;
        document.getElementById("title-failed").textContent = failedIsError
          ? copy.errorTitle
          : copy.failedTitle;
        document.getElementById("msg-failed").textContent = failedIsError
          ? copy.errorMsg
          : copy.failedMsg;
        document.getElementById("title-pending").textContent = pendingFinal
          ? copy.pendingFinalTitle
          : copy.pendingTitle;
        document.getElementById("msg-pending").textContent = pendingFinal
          ? copy.pendingFinalMsg
          : copy.pendingMsg;
        document.getElementById("hint").textContent = copy.closeHint;
        var back = shared.payLinkBackUrl(params);
        var backEl = document.getElementById("back-pay");
        var backLink = document.getElementById("back-pay-link");
        if (back && (currentView === "failed" || currentView === "pending")) {
          backLink.href = back;
          backLink.textContent = copy.backToPay;
          backEl.hidden = false;
        } else {
          backEl.hidden = true;
        }
        renderRefs();
      }

      function provider() {
        var p = (params.get("provider") || "").trim().toLowerCase();
        if (p) return p;
        if (params.get("payment_id") || params.get("paymentId")) return "alqaseh";
        if (params.get("tranRef") || params.get("tran_ref")) return "paytabs";
        if (params.get("ref") && (params.get("p") || params.get("t"))) return "qicard";
        return "";
      }

      if (provider() === "zaincash") {
        zaincashReturn = shared.parseZaincashReturnParams(location.search);
      }

      function paymentRef() {
        if (zaincashReturn && zaincashReturn.ref) {
          return zaincashReturn.ref.trim();
        }
        return (
          params.get("ref") ||
          params.get("payment_id") ||
          params.get("paymentId") ||
          params.get("tranRef") ||
          params.get("tran_ref") ||
          ""
        ).trim();
      }

      function orderRef() {
        return (
          params.get("order_id") ||
          params.get("orderId") ||
          params.get("cartId") ||
          params.get("cart_id") ||
          ""
        ).trim();
      }

      function projectId() {
        return (
          params.get("firebaseProjectId") ||
          params.get("firebase_project_id") ||
          ""
        ).trim();
      }

      function showView(name) {
        currentView = name;
        ["verifying", "paid", "failed", "pending"].forEach(function (v) {
          document.getElementById("view-" + v).hidden = v !== name;
        });
      }

      function renderRefs() {
        var refs = document.getElementById("refs");
        var html = "";
        var order = orderRef();
        var pay = paymentRef();
        var copy = t();
        if (order) {
          html +=
            '<div class="ref-block"><div class="ref-label">' +
            copy.orderRef +
            '</div><div class="ref-value">' +
            shared.escapeHtml(order) +
            "</div></div>";
        }
        if (pay) {
          html +=
            '<div class="ref-block"><div class="ref-label">' +
            copy.paymentRef +
            '</div><div class="ref-value">' +
            shared.escapeHtml(pay) +
            "</div></div>";
        }
        if (html) {
          refs.innerHTML = html;
          refs.hidden = false;
        } else {
          refs.hidden = true;
        }
      }

      function statusUrl() {
        var q = new URLSearchParams();
        q.set("provider", provider());
        q.set("firebaseProjectId", projectId());
        q.set("ref", paymentRef());
        if (zaincashReturn && zaincashReturn.token) {
          q.set("token", zaincashReturn.token);
        }
        return STATUS_ENDPOINT + "?" + q.toString();
      }

      function applyState(state) {
        failedIsError = false;
        pendingFinal = false;
        renderRefs();
        if (state === "paid") {
          showView("paid");
          renderAllText();
          return;
        }
        if (state === "failed") {
          showView("failed");
          renderAllText();
          return;
        }
        if (state === "pending") {
          showView("pending");
          renderAllText();
          return;
        }
        failedIsError = true;
        showView("failed");
        renderAllText();
      }

      function fetchStatus() {
        return fetch(statusUrl(), {
          method: "GET",
          headers: { Accept: "application/json" },
          cache: "no-store",
        }).then(function (res) {
          if (!res.ok) throw new Error("status " + res.status);
          return res.json();
        });
      }

      function poll(attempt) {
        fetchStatus()
          .then(function (data) {
            var state = (data && data.state) || "pending";
            if (state === "paid" || state === "failed") {
              applyState(state);
              return;
            }
            if (attempt >= POLL_MAX) {
              pendingFinal = true;
              showView("pending");
              renderAllText();
              return;
            }
            pendingFinal = false;
            showView("pending");
            renderAllText();
            setTimeout(function () {
              poll(attempt + 1);
            }, POLL_MS);
          })
          .catch(function () {
            if (attempt >= POLL_MAX) {
              applyState("error");
              return;
            }
            setTimeout(function () {
              poll(attempt + 1);
            }, POLL_MS);
          });
      }

      if (!provider() || !projectId() || !paymentRef()) {
        failedIsError = true;
        showView("failed");
        renderAllText();
        return;
      }

      showView("verifying");
      renderAllText();
      poll(0);
    })();
  </script>
</body>
</html>
