<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Point OS — Payment</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --ref-bg: #f1f5f9;
      --success: #059669;
      --success-bg: #ecfdf5;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --pending: #d97706;
      --pending-bg: #fffbeb;
      --verifying: #2563eb;
      --verifying-bg: #eff6ff;
      --verifying-spinner-track: #dbeafe;
      --toolbar-bg: rgba(255, 255, 255, 0.92);
      --toolbar-border: #e2e8f0;
      --toggle-bg: #f1f5f9;
      --toggle-active-bg: #ffffff;
      --toggle-active-text: #0f172a;
      --toggle-text: #64748b;
    }
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --ref-bg: #0f172a;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --error: #f87171;
      --error-bg: rgba(248, 113, 113, 0.12);
      --pending: #fbbf24;
      --pending-bg: rgba(251, 191, 36, 0.12);
      --verifying: #60a5fa;
      --verifying-bg: rgba(96, 165, 250, 0.12);
      --verifying-spinner-track: #1e3a5f;
      --toolbar-bg: rgba(30, 41, 59, 0.92);
      --toolbar-border: #334155;
      --toggle-bg: #0f172a;
      --toggle-active-bg: #334155;
      --toggle-active-text: #f8fafc;
      --toggle-text: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .wrap { width: 100%; max-width: 520px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 8px 10px;
      border: 1px solid var(--toolbar-border);
      border-radius: 14px;
      background: var(--toolbar-bg);
      backdrop-filter: blur(8px);
    }
    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      background: var(--toggle-bg);
    }
    .toolbar-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--toggle-text);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .toolbar-btn:hover { color: var(--toggle-active-text); }
    .toolbar-btn.active {
      background: var(--toggle-active-bg);
      color: var(--toggle-active-text);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .toolbar-btn.icon-btn {
      min-width: 36px;
      padding-inline: 10px;
      font-size: 15px;
    }
    .brand {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px 24px;
      text-align: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .icon.success { background: var(--success-bg); color: var(--success); }
    .icon.failed { background: var(--error-bg); color: var(--error); }
    .icon.pending { background: var(--pending-bg); color: var(--pending); }
    .icon.verifying { background: var(--verifying-bg); color: var(--verifying); }
    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      line-height: 1.3;
    }
    h1.success { color: var(--success); }
    h1.failed { color: var(--error); }
    h1.pending { color: var(--pending); }
    h1.verifying { color: var(--verifying); }
    .message {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }
    .refs {
      margin-top: 22px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: start;
    }
    .ref-block {
      background: var(--ref-bg);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
    }
    .ref-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .ref-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      word-break: break-all;
      color: var(--text);
    }
    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--verifying-spinner-track);
      border-top-color: var(--verifying);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-group" role="group" aria-label="Language">
        <button type="button" class="toolbar-btn" id="lang-ar" data-lang="ar">العربية</button>
        <button type="button" class="toolbar-btn" id="lang-en" data-lang="en">English</button>
      </div>
      <div class="toolbar-group" role="group" aria-label="Theme">
        <button type="button" class="toolbar-btn icon-btn" id="theme-light" aria-label="Light mode">☀</button>
        <button type="button" class="toolbar-btn icon-btn" id="theme-dark" aria-label="Dark mode">☾</button>
      </div>
    </div>
    <div class="brand" id="brand">Point OS</div>
    <div class="card">
      <div id="view-verifying">
        <div class="spinner" aria-hidden="true"></div>
        <h1 class="verifying" id="title-verifying"></h1>
        <p class="message" id="msg-verifying"></p>
      </div>
      <div id="view-paid" hidden>
        <div class="icon success" aria-hidden="true">✓</div>
        <h1 class="success" id="title-paid"></h1>
        <p class="message" id="msg-paid"></p>
      </div>
      <div id="view-failed" hidden>
        <div class="icon failed" aria-hidden="true">✕</div>
        <h1 class="failed" id="title-failed"></h1>
        <p class="message" id="msg-failed"></p>
      </div>
      <div id="view-pending" hidden>
        <div class="icon pending" aria-hidden="true">…</div>
        <h1 class="pending" id="title-pending"></h1>
        <p class="message" id="msg-pending"></p>
      </div>
      <div class="refs" id="refs" hidden></div>
      <p class="hint" id="hint"></p>
    </div>
  </div>
  <script>
    (function () {
      var STATUS_ENDPOINT =
        "https://nbyhcxhdkxrathjaacvj.supabase.co/functions/v1/card-payment-status";
      var POLL_MS = 3000;
      var POLL_MAX = 20;
      var LANG_KEY = "point_payment_result_lang";
      var THEME_KEY = "point_payment_result_theme";

      var params = new URLSearchParams(location.search);
      var currentView = "verifying";
      var pendingFinal = false;
      var failedIsError = false;

      var STRINGS = {
        ar: {
          brand: "Point OS",
          verifyingTitle: "جاري التحقق من الدفع",
          verifyingMsg: "يرجى الانتظار بينما نؤكد حالة الدفع مع مزود الخدمة.",
          paidTitle: "تم استلام الدفع",
          paidMsg: "شكراً لك. تم تسجيل دفعتك بنجاح.",
          failedTitle: "لم يكتمل الدفع",
          failedMsg: "لم تتم عملية الدفع. يمكنك المحاولة مرة أخرى عبر رابط الفاتورة.",
          pendingTitle: "الدفع قيد المعالجة",
          pendingMsg: "ما زلنا نؤكد حالة الدفع. سنحدّث هذه الصفحة تلقائياً.",
          pendingFinalTitle: "الدفع قيد التأكيد",
          pendingFinalMsg: "سيتم تأكيد الدفع قريباً. يمكنك إغلاق هذه الصفحة بأمان.",
          orderRef: "مرجع الطلب",
          paymentRef: "مرجع الدفع",
          closeHint: "يمكنك إغلاق هذه النافذة الآن.",
          errorTitle: "تعذّر التحقق",
          errorMsg: "حدث خطأ أثناء التحقق من الدفع. يرجى المحاولة لاحقاً.",
        },
        en: {
          brand: "Point OS",
          verifyingTitle: "Verifying payment",
          verifyingMsg: "Please wait while we confirm your payment with the provider.",
          paidTitle: "Payment received",
          paidMsg: "Thank you. Your payment was recorded successfully.",
          failedTitle: "Payment not completed",
          failedMsg: "The payment was not completed. You can try again using the invoice link.",
          pendingTitle: "Payment processing",
          pendingMsg: "We are still confirming your payment. This page will update automatically.",
          pendingFinalTitle: "Payment pending confirmation",
          pendingFinalMsg: "Your payment will be confirmed shortly. You can safely close this page.",
          orderRef: "Order reference",
          paymentRef: "Payment reference",
          closeHint: "You can close this window now.",
          errorTitle: "Verification failed",
          errorMsg: "We could not verify the payment. Please try again later.",
        },
      };

      function detectLang() {
        var stored = localStorage.getItem(LANG_KEY);
        if (stored === "ar" || stored === "en") return stored;
        return "ar";
      }

      function detectTheme() {
        var stored = localStorage.getItem(THEME_KEY);
        if (stored === "light" || stored === "dark") return stored;
        return "dark";
      }

      var lang = detectLang();
      var theme = detectTheme();

      function t() {
        return STRINGS[lang];
      }

      function setLang(next) {
        if (next !== "ar" && next !== "en") return;
        lang = next;
        localStorage.setItem(LANG_KEY, lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        updateLangButtons();
        renderAllText();
      }

      function setTheme(next) {
        if (next !== "light" && next !== "dark") return;
        theme = next;
        localStorage.setItem(THEME_KEY, theme);
        document.documentElement.setAttribute("data-theme", theme);
        updateThemeButtons();
      }

      function updateLangButtons() {
        document.getElementById("lang-ar").classList.toggle("active", lang === "ar");
        document.getElementById("lang-en").classList.toggle("active", lang === "en");
      }

      function updateThemeButtons() {
        document.getElementById("theme-light").classList.toggle("active", theme === "light");
        document.getElementById("theme-dark").classList.toggle("active", theme === "dark");
      }

      function renderAllText() {
        var copy = t();
        document.getElementById("brand").textContent = copy.brand;
        document.getElementById("title-verifying").textContent = copy.verifyingTitle;
        document.getElementById("msg-verifying").textContent = copy.verifyingMsg;
        document.getElementById("title-paid").textContent = copy.paidTitle;
        document.getElementById("msg-paid").textContent = copy.paidMsg;
        document.getElementById("title-failed").textContent = failedIsError
          ? copy.errorTitle
          : copy.failedTitle;
        document.getElementById("msg-failed").textContent = failedIsError
          ? copy.errorMsg
          : copy.failedMsg;
        document.getElementById("title-pending").textContent = pendingFinal
          ? copy.pendingFinalTitle
          : copy.pendingTitle;
        document.getElementById("msg-pending").textContent = pendingFinal
          ? copy.pendingFinalMsg
          : copy.pendingMsg;
        document.getElementById("hint").textContent = copy.closeHint;
        renderRefs();
      }

      document.getElementById("lang-ar").addEventListener("click", function () {
        setLang("ar");
      });
      document.getElementById("lang-en").addEventListener("click", function () {
        setLang("en");
      });
      document.getElementById("theme-light").addEventListener("click", function () {
        setTheme("light");
      });
      document.getElementById("theme-dark").addEventListener("click", function () {
        setTheme("dark");
      });

      setTheme(theme);
      setLang(lang);

      function provider() {
        var p = (params.get("provider") || "").trim().toLowerCase();
        if (p) return p;
        if (params.get("payment_id") || params.get("paymentId")) return "alqaseh";
        if (params.get("tranRef") || params.get("tran_ref")) return "paytabs";
        return "";
      }

      function paymentRef() {
        return (
          params.get("ref") ||
          params.get("payment_id") ||
          params.get("paymentId") ||
          params.get("tranRef") ||
          params.get("tran_ref") ||
          ""
        ).trim();
      }

      function orderRef() {
        return (
          params.get("order_id") ||
          params.get("orderId") ||
          params.get("cartId") ||
          params.get("cart_id") ||
          ""
        ).trim();
      }

      function projectId() {
        return (
          params.get("firebaseProjectId") ||
          params.get("firebase_project_id") ||
          ""
        ).trim();
      }

      function showView(name) {
        currentView = name;
        ["verifying", "paid", "failed", "pending"].forEach(function (v) {
          document.getElementById("view-" + v).hidden = v !== name;
        });
      }

      function renderRefs() {
        var refs = document.getElementById("refs");
        var html = "";
        var order = orderRef();
        var pay = paymentRef();
        var copy = t();
        if (order) {
          html +=
            '<div class="ref-block"><div class="ref-label">' +
            copy.orderRef +
            '</div><div class="ref-value">' +
            escapeHtml(order) +
            "</div></div>";
        }
        if (pay) {
          html +=
            '<div class="ref-block"><div class="ref-label">' +
            copy.paymentRef +
            '</div><div class="ref-value">' +
            escapeHtml(pay) +
            "</div></div>";
        }
        if (html) {
          refs.innerHTML = html;
          refs.hidden = false;
        } else {
          refs.hidden = true;
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function statusUrl() {
        var q = new URLSearchParams();
        q.set("provider", provider());
        q.set("firebaseProjectId", projectId());
        q.set("ref", paymentRef());
        return STATUS_ENDPOINT + "?" + q.toString();
      }

      function applyState(state) {
        failedIsError = false;
        pendingFinal = false;
        renderRefs();
        if (state === "paid") {
          showView("paid");
          renderAllText();
          return;
        }
        if (state === "failed") {
          showView("failed");
          renderAllText();
          return;
        }
        if (state === "pending") {
          showView("pending");
          renderAllText();
          return;
        }
        failedIsError = true;
        showView("failed");
        renderAllText();
      }

      function fetchStatus() {
        return fetch(statusUrl(), {
          method: "GET",
          headers: { Accept: "application/json" },
          cache: "no-store",
        }).then(function (res) {
          if (!res.ok) throw new Error("status " + res.status);
          return res.json();
        });
      }

      function poll(attempt) {
        fetchStatus()
          .then(function (data) {
            var state = (data && data.state) || "pending";
            if (state === "paid" || state === "failed") {
              applyState(state);
              return;
            }
            if (attempt >= POLL_MAX) {
              pendingFinal = true;
              showView("pending");
              renderAllText();
              return;
            }
            pendingFinal = false;
            showView("pending");
            renderAllText();
            setTimeout(function () {
              poll(attempt + 1);
            }, POLL_MS);
          })
          .catch(function () {
            if (attempt >= POLL_MAX) {
              applyState("error");
              return;
            }
            setTimeout(function () {
              poll(attempt + 1);
            }, POLL_MS);
          });
      }

      if (!provider() || !projectId() || !paymentRef()) {
        failedIsError = true;
        showView("failed");
        renderAllText();
        return;
      }

      showView("verifying");
      renderAllText();
      poll(0);
    })();
  </script>
</body>
</html>
