<!DOCTYPE html><html><head>

  <!-- FCM معطّل على الويب: لا نسجّل firebase-messaging-sw.js (دفع عن بُعد فقط على iOS/Android). -->

  <!-- Self-host Firebase JS SDK (see web/firebasejs/ and scripts/sync-firebase-web-sdk.ps1).
       Import map redirects FlutterFire's gstatic dynamic imports to local copies when CDN is blocked. -->
  <script type="importmap">
  {
    "imports": {
      "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js": "./firebasejs/12.14.0/firebase-app.js",
      "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js": "./firebasejs/12.14.0/firebase-auth.js",
      "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-pipelines.js": "./firebasejs/12.14.0/firebase-firestore-pipelines.js",
      "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js": "./firebasejs/12.14.0/firebase-storage.js"
    }
  }
  </script>
  <script>
    window.flutterfire_ignore_scripts = ['messaging'];
  </script>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="point">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="icons/Icon-192.png">

  <title>point</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; }
    /* Match AnimatedSplashScreen web logo size; outside splash-screen-style so
       flutter_native_splash:create does not overwrite it. */
    #splash img.center {
      max-width: min(35vw, 280px);
      max-height: 64px;
      width: auto;
      height: auto;
    }
  </style>
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0F0F14;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  <!-- Default Flutter bootstrap. CI uses --pwa-strategy none (no service worker).
       In-app update UX polls version.json via WebUpdateController. -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
