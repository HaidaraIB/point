# نشر Flutter Web على Firebase Hosting — مشروع الاختبار فقط (point-f33cb).
# الإنتاج للمستخدمين النهائيين: deploy-hostinger-web.yml
#
# يتطلب أن يكون لديك Hosting مفعّلاً في مشروع الاختبار، وأن FIREBASE_TOKEN يسمح بالنشر إليه.
name: Deploy to Firebase Hosting (test project)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate firebase-messaging-sw.js (test project)
        run: node scripts/generate-firebase-sw.js --test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # إصدار release لكن Firebase = اختبار (لا يعتمد على kDebugMode)
      - name: Build web (test Firebase)
        run: >
          flutter build web --release
          --dart-define=USE_FIREBASE_TEST=true
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          --dart-define=SUPABASE_STORAGE_BASE_URL="${{ secrets.SUPABASE_STORAGE_BASE_URL }}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (test project)
        run: >
          firebase deploy --only hosting
          --non-interactive
          --project point-f33cb
          --token "${{ secrets.FIREBASE_TOKEN }}"
