# نشر Flutter Web على Hostinger — مشروع Firebase الإنتاج فقط (point-agency-production).
# بيئة الاختبار على Firebase Hosting: deploy-firebase-hosting.yml
#
# الإعداد في GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER — Hostinger: إما اسم المضيف من لوحة FTP أو عنوان IP (مثلاً 37.44.245.153)
#             إذا فشل حلّ اسم مثل ftp.point-iq.app استخدم IP من صفحة «FTP Access».
#   FTP_USERNAME — لحساب فرعي مثل agency استخدم الاسم الكامل: u....agency وليس حساب FTP الرئيسي فقط.
#   FTP_PASSWORD
# النطاق الفرعي agency.point-iq.app يشير عادةً لمجلد agency — جذر FTP = جذر الموقع على ذلك النطاق (مسار URL = /).
# --base-href يجب أن يكون / وليس /agency/ عند استخدام نطاق فرعي، وإلا تُحمّل الأصول من مسار خاطئ.
# وأسرار Supabase نفسها المستخدمة في deploy-firebase-hosting.yml:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_STORAGE_BASE_URL
#
# تشغيل يدوي: Actions → Deploy web to Hostinger (FTP) → Run workflow
name: Deploy web to Hostinger (FTP)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-hostinger-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate firebase-messaging-sw.js (production)
        run: node scripts/generate-firebase-sw.js

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # نطاق فرعي agency.point-iq.app → base-href = / (جذر النطاق)
      # --pwa-strategy none يقلّل تخزين نسخة قديمة من التطبيق عبر service worker الافتراضي (offline-first)
      - name: Build web (release, production Firebase)
        run: >
          flutter build web --release
          --base-href /
          --pwa-strategy none
          --dart-define=USE_FIREBASE_PROD=true
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          --dart-define=SUPABASE_STORAGE_BASE_URL="${{ secrets.SUPABASE_STORAGE_BASE_URL }}"

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/web/
          # حساب FTP الفرعي (.agency): الجذر هو مجلد agency — ارفع إلى /
          server-dir: /
          # لا تحذف ملفات على السيرفر غير الموجودة محلياً (احذف هذا السطر إن أردت مرآة كاملة)
          dangerous-clean-slate: false
